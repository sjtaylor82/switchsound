name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows app
        shell: pwsh
        run: ./native/windows/build.ps1
      - name: Rename Windows build
        shell: pwsh
        run: Move-Item native/windows/dist/SwitchSound.exe SwitchSound-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SwitchSound-Windows-x64.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: ./native/macos/build-app.sh
      - name: Check architectures and bundle
        run: |
          lipo -info native/macos/dist/SwitchSound.app/Contents/MacOS/SwitchSound
          codesign --verify --deep --strict native/macos/dist/SwitchSound.app
      - name: Package macOS app
        run: |
          mkdir SwitchSound-macOS
          ditto native/macos/dist/SwitchSound.app SwitchSound-macOS/SwitchSound.app
          cp prepare-macos.sh SwitchSound-macOS/prepare-macos.sh
          chmod +x SwitchSound-macOS/prepare-macos.sh
          sh -n SwitchSound-macOS/prepare-macos.sh
          ditto -c -k --sequesterRsrc --keepParent SwitchSound-macOS SwitchSound-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: SwitchSound-macOS-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "SwitchSound ${GITHUB_REF_NAME}"
